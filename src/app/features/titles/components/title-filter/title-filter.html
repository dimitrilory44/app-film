<div class="filter-items">
    <div class="filter-items__left">
        <mat-button-toggle-group 
            class="pill-toggle" 
            [(value)]="selectedFilter" 
            (change)="onFilterChange($event.value)"
            hideSingleSelectionIndicator>
            <mat-button-toggle value="all">Tout</mat-button-toggle>
            <mat-button-toggle value="movie">Films</mat-button-toggle>
            <mat-button-toggle value="tv">Séries</mat-button-toggle>
        </mat-button-toggle-group>

        <span class="filter-items__count">{{ count() | number:'1.0-0' }} Titres</span>
    </div>
    <div class="filter-items__right">
        <button 
            class="platforms" 
            aria-label="Plateformes disponibles"
            (click)="isFilterProviderPanelExpanded.set(!isFilterProviderPanelExpanded())">
            <div class="platforms__stack">
                @for(provider of previewProviders(); track provider.provider_id) {
                <img 
                    class="platforms__icon" 
                    [src]="provider.logo_path | tmdbImage:'w45':'assets/placeholder-icon.png'"
                    [alt]="provider.provider_name" 
                    appImgFallback="assets/provider-fallback.svg"/>
                }
            </div>
            <span class="platforms__badge">{{ selectedProvidersCount() | number:'1.0-0' }}</span>
        </button>

        <button 
            mat-icon-button 
            class="action-btn" 
            aria-label="Trier" 
            [matMenuTriggerFor]="menu">
            <mat-icon>sort</mat-icon>
        </button>
        <button 
            mat-stroked-button 
            class="filter-btn"
            [class.is-active]="isSelectedGenres()" 
            aria-label="Filtres"
            (click)="isFilterCriteriaPanelExpanded.set(!isFilterCriteriaPanelExpanded())">
            <mat-icon>filter_alt</mat-icon>
            Filtres
            @if (countFilters() > 0) {
                <span class="filters__badge">{{ countFilters() | number:'1.0-0' }}</span>
            }
        </button>
    </div>
</div>

@if (isFilterProviderPanelExpanded()) {
<title-filter-providers/>
}

<mat-menu #menu="matMenu" class="filter-menu" [overlapTrigger]="false">
    @for (option of sortOptions; track option.value) {
        <button 
            mat-menu-item 
            [class.is-active]="selectedSort() === option.value"
            (click)="selectSort(option.value)">
            {{ option.label }}
        </button>
    }
</mat-menu>

@if (isFilterCriteriaPanelExpanded()) {
<title-filter-criteria/>
}
